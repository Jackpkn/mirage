# The secrets plane, all three blocks:
#   secrets:  one entry per account, naming the source and its config.
#   mounts:   a resource credential may be a {from, ref, key} pointer.
#   env:      a session variable may be one too.
#
# One file, either CLI:
#   mirage      workspace create examples/python/secrets/workspace.yaml --id secrets
#   ./mirage-ts workspace create examples/python/secrets/workspace.yaml --id secrets
#
# `secrets_app.py` is the same thing built in application code.

mode: WRITE

mounts:
  /data:
    resource: ram

  /slack:
    resource: slack
    mode: READ
    config:
      token:
        from: op
        ref: op://mirage/SLACK_BOT_TOKEN
        key: credential
      search_token:
        from: op
        ref: op://mirage/SLACK_USER_TOKEN
        key: credential

secrets:
  # The one credential the deployment holds itself. Omitted entirely,
  # the source falls back to OP_SERVICE_ACCOUNT_TOKEN in the host env.
  op:
    source: 1password
    config:
      token:
        from: dotenv
        ref: .env.development
        key: OP_SERVICE_ACCOUNT_TOKEN

env:
  # An API Credential item's secret field is `credential`, whatever the
  # item is named.
  SLACK_BOT_TOKEN:
    from: op
    ref: op://mirage/SLACK_BOT_TOKEN
    key: credential

  # The other ref shape 1Password writes, field and all.
  SLACK_USER_TOKEN:
    from: op
    ref: op://mirage/SLACK_USER_TOKEN/credential
    key: credential

  # A literal: no source, no fetch.
  MIRAGE_ENV:
    value: demo
