# The mirage bundle patch. Applied over dsh-base by `dsh --profile <name>`
# after `dsh plugin --profile <name> add @struktoai/mirage-dsh`: it swaps
# the filesystem and shell providers for mirage-backed ones, so dsh's file
# tools and bash tool operate on a workspace of mounted resources instead
# of the host disk.
#
# Override the `mirage` row's config in the profile's own cordis.patch.yml
# to mount real resources (the block form is `resource` registry name,
# `mode`, and the resource's `config`; `!!js` expressions resolve env vars
# at mount time):
#
#   - id: mirage
#     config:
#       mounts:
#         /tmp: { resource: ram, mode: exec }
#         /slack:
#           resource: slack
#           mode: read
#           config: { token: !!js process.env.SLACK_BOT_TOKEN }
#       runtimes:
#         - { name: monty, captures: [python, python3] }
#
# Two facts about how the mirage providers read the surrounding dsh
# composition, neither of which needs a row here:
#
#   * The standing file policy is enforced, not merely reported. Both
#     seams narrow every mount grant to read for a `read-only` call
#     (leaving the null sink writable, as that mode's definition
#     requires), so dsh-base's `DSH_PERMISSION_MODE=read-only` now
#     actually confines a mirage world instead of being ignored. The
#     policy's `workspaceRoot` is a directory on the host and is never
#     consulted: the mounts and their modes are the boundary here.
#
#   * A workdir dsh resolved on its own machine (an unspecified one
#     comes from the calling session's cwd) names nothing in this world,
#     so it is ignored in favour of the workspace default rather than
#     run in a directory the agent cannot reach.

# The host filesystem and bash providers step aside; mirage provides the
# same ctx.fs and ctx.shell seams over the workspace.
- id: fs-sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

# PowerShell and the ripgrep-based search tool run host subprocesses,
# which the mirage world does not contain; the bash tool's grep covers
# search inside the workspace.
- id: pwsh-sandbox
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-fs-search
  disabled: true

- insert:
    - id: mirage
      name: '@struktoai/mirage-dsh/service'
      config:
        mounts:
          /tmp: { resource: ram, mode: exec }

    - id: mirage-fs
      name: '@struktoai/mirage-dsh/fs'

    - id: mirage-shell
      name: '@struktoai/mirage-dsh/shell'
