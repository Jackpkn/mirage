name: Perf experiment (temporary)

permissions:
  contents: read

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

# No cancel-in-progress: a cancelled arm is a lost sample.
concurrency:
  group: perf-exp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every arm is a SIBLING job on its own runner at the same commit, so they
  # share hardware class and queue conditions instead of being separated in
  # time the way a sequential local benchmark is. Two reps per config.
  pytest-matrix:
    name: "pytest ${{ matrix.dist }} n${{ matrix.procs }} rep${{ matrix.rep }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dist: loadscope, procs: 4, rep: 1}
          - {dist: loadscope, procs: 4, rep: 2}
          - {dist: worksteal, procs: 4, rep: 1}
          - {dist: worksteal, procs: 4, rep: 2}
          - {dist: loadfile,  procs: 4, rep: 1}
          - {dist: loadfile,  procs: 4, rep: 2}
          - {dist: worksteal, procs: 8, rep: 1}
          - {dist: worksteal, procs: 8, rep: 2}
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      mongodb:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Report the hardware, so a slow arm can be attributed
        run: |
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel
      - name: Timed pytest arm
        working-directory: python
        env:
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URI: mongodb://localhost:27017
        run: |
          redis_serial=(
            tests/cache/file/test_redis_cache.py
            tests/cache/index/test_redis.py
            tests/cache/index/test_redis_order.py
            tests/commands/builtin/redis
            tests/core/redis
            tests/observe/test_redis_store.py
            tests/ops/redis
            tests/resource/redis
            tests/shell/console/redis/test_store.py
          )
          ignore_args=(--ignore=tests/agents/camel)
          for path in "${redis_serial[@]}"; do ignore_args+=("--ignore=$path"); done
          S=$(date +%s)
          uv run pytest -n ${{ matrix.procs }} --dist ${{ matrix.dist }} "${ignore_args[@]}" \
            | tail -3
          echo "ARM_RESULT dist=${{ matrix.dist }} procs=${{ matrix.procs }} rep=${{ matrix.rep }} wall_seconds=$(( $(date +%s) - S ))"
